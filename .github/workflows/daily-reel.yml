name: Daily Automated Instagram Reel

on:
  schedule:
    # 09:00 UTC = 14:00 (2:00 PM) Asia/Karachi (PKT) every day
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if already ran today'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-reel-run
  cancel-in-progress: false

jobs:
  publish-reel:
    name: Generate & Publish Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Ensure Multimedia & Headless Chrome Dependencies
        run: |
          sudo apt-get update || true
          # Install audio/graphics libraries with fallback across Ubuntu versions (22.04 / 24.04 / 26.04)
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgbm1 \
            libnss3 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 \
            || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Ensure Remotion Browser Shell
        run: npx remotion browser ensure

      - name: Setup Kokoro TTS Models
        run: npm run setup:kokoro

      - name: Generate Prisma Client & Synchronize Database Schema
        run: |
          npm run prisma:generate
          npx prisma db push --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Execute Daily Reel Pipeline
        run: npm run publish:daily
        env:
          NODE_ENV: production
          FORCE_PUBLISH: ${{ inputs.force || false }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_API_VERSION: 'v27.0'
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SCHEDULER_TIMEZONE: 'Asia/Karachi'
          PUBLIC_MEDIA_BASE_URL: 'https://res.cloudinary.com'
